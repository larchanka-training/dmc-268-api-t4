name: LLM smoke

on:
  push:
    branches: [devops/backend-cd] # TEMP: removed before the merge
    paths: [.github/workflows/llm-smoke.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet .

      # TEMP: one-off diagnosis of the Eurouter 400, removed right after the run.
      - name: Diagnose Eurouter model routing
        env:
          LLM_KEYS: ${{ secrets.AI_DMC268_T4 }}
          BASE_URL: ${{ vars.AI_DMC268_URL }}
        run: |
          set +e -uo pipefail
          key=$(printf '%s' "${LLM_KEYS%%,*}" | tr -d '[:space:]')
          base="${BASE_URL:-https://api.eurouter.ai/api/v1}"
          base="${base%/}"
          auth() { printf 'header = "Authorization: Bearer %s"\n' "$key"; }
          other=$(auth | curl -sS --max-time 20 -K - "$base/models" \
            | python3 -c "import json,sys; ids=[m['id'] for m in json.load(sys.stdin).get('data', [])]; print(next((i for i in ids if 'mistral-small' in i), next((i for i in ids if 'mistral' in i), 'mistral-small')))" 2>/dev/null)
          echo "non-Anthropic model picked from the catalog: ${other:-mistral-small}"
          probe() {
            local label="$1" model="$2" extra="$3" body response code message
            body=$(python3 -c "import json,sys; b={'model': sys.argv[1], 'messages': [{'role': 'user', 'content': 'ping'}], 'max_tokens': 5}; b.update(json.loads(sys.argv[2])); print(json.dumps(b))" "$model" "$extra")
            response=$(auth | curl -sS --max-time 30 -K - -H 'Content-Type: application/json' \
              -o "$RUNNER_TEMP/probe.json" -w '%{http_code}' -d "$body" "$base/chat/completions")
            code=$response
            message=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); e=d.get('error') or {}; print((e.get('message') if isinstance(e, dict) else str(e)) or 'ok')" "$RUNNER_TEMP/probe.json" 2>/dev/null || echo "unparseable body")
            printf '| %s | `%s` | %s | %s | %s |\n' "$label" "$model" "${extra}" "$code" "${message:0:160}" | tee -a "$RUNNER_TEMP/diag.md"
          }
          printf '| # | model | extra params | HTTP | error.message |\n|---|---|---|---|---|\n' > "$RUNNER_TEMP/diag.md"
          probe 1 claude-sonnet-4-6 '{}'
          probe 2 claude-sonnet-4-6 '{"temperature": 0}'
          probe 3 claude-sonnet-4-6 '{"temperature": 0, "response_format": {"type": "json_object"}}'
          probe 4 anthropic/claude-sonnet-4-6 '{}'
          probe 5 claude-haiku-4.5 '{}'
          probe 6 "${other:-mistral-small}" '{}'
          { echo "## Eurouter diagnosis"; cat "$RUNNER_TEMP/diag.md"; } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/probe.json"

      - name: Review the SQL injection fixture with the live key
        env:
          LLM_PRIMARY_API_KEYS: ${{ secrets.AI_DMC268_T4 }}
          LLM_PRIMARY_BASE_URL: ${{ vars.AI_DMC268_URL }}
          LLM_PRIMARY_MODEL: ${{ vars.LLM_PRIMARY_MODEL }}
        run: |
          # GitHub runs steps with bash -e; failures are classified below, so -e is off.
          set +e -uo pipefail
          result="$RUNNER_TEMP/review.json"
          errors="$RUNNER_TEMP/smoke.err"
          # stdout holds the model's findings text: keep it out of the public log and summary.
          .venv/bin/python -m adapters.llm.smoke tests/fixtures/sql_injection.diff \
            --title "Add a sortable users list" >"$result" 2>"$errors"
          status=$?
          # stderr: gateway INFO/WARNING lines (provider, model, duration, counts) or the error.
          cat "$errors"
          if [ "$status" -ne 0 ]; then
            reason=$(grep -m1 -E '^(configuration error|review failed|cannot read)' "$errors" || echo "smoke exited with $status")
            {
              echo "## LLM smoke: failed"
              echo '```text'
              printf '%s\n' "$reason"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$reason"
            exit 1
          fi
          .venv/bin/python - "$result" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections
          import json
          import sys

          result = json.load(open(sys.argv[1], encoding="utf-8"))
          findings = result["findings"]
          print("## LLM smoke")
          print(f"- provider: `{result['provider']}`")
          print(f"- model: `{result['model']}`")
          print(f"- findings: **{len(findings)}**")
          if findings:
              print()
              print("| severity | category | count |")
              print("|---|---|---|")
              counts = collections.Counter((f["severity"], f["category"]) for f in findings)
              for (severity, category), count in sorted(counts.items()):
                  print(f"| {severity} | {category} | {count} |")
          PY
          count=$(.venv/bin/python -c "import json,sys; print(len(json.load(open(sys.argv[1]))['findings']))" "$result")
          if [ "$count" -eq 0 ]; then
            echo "::error::the model returned no findings for a diff with a SQL injection"
            exit 1
          fi
