name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag (commit sha) to roll back to; empty builds the current commit"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/larchanka-training/dmc-268-api-t4
  APP_DIR: /opt/dmc268

jobs:
  build:
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the Sentry release step's set-commits --auto reads the
          # commits since the previous release from this checkout.
          fetch-depth: 0

      - name: Check inputs
        env:
          HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
          HAS_DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD != '' }}
          HAS_LLM_KEYS: ${{ secrets.AI_DMC268_T4 != '' }}
          HAS_LLM_URL: ${{ vars.AI_DMC268_URL != '' }}
          HAS_LLM_MODEL: ${{ vars.LLM_PRIMARY_MODEL != '' }}
          HAS_TYPESAFE_KEY: ${{ secrets.TYPESAFE_API_KEY != '' }}
          HAS_GH_APP_ID: ${{ secrets.GH_APP_ID != '' }}
          HAS_GH_APP_SLUG: ${{ vars.GH_APP_SLUG != '' }}
          HAS_GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID != '' }}
          HAS_GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET != '' }}
          HAS_GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY != '' }}
          HAS_GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET != '' }}
          HAS_SENTRY_DSN: ${{ secrets.SENTRY_DSN != '' }}
          HAS_GRAFANA_PROM_URL: ${{ vars.GRAFANA_CLOUD_PROM_URL != '' }}
          HAS_GRAFANA_PROM_USER: ${{ vars.GRAFANA_CLOUD_PROM_USER != '' }}
          HAS_GRAFANA_LOKI_URL: ${{ vars.GRAFANA_CLOUD_LOKI_URL != '' }}
          HAS_GRAFANA_LOKI_USER: ${{ vars.GRAFANA_CLOUD_LOKI_USER != '' }}
          HAS_GRAFANA_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN != '' }}
          HAS_POSTGRES_EXPORTER_PASSWORD: ${{ secrets.POSTGRES_EXPORTER_PASSWORD != '' }}
        run: |
          set -euo pipefail
          # The site name embeds the server IP: mask it before anything can print it.
          if [ -n "$DEPLOY_HOST" ]; then
            echo "::add-mask::${DEPLOY_HOST//./-}"
            echo "::add-mask::${DEPLOY_HOST//./-}.sslip.io"
            echo "SITE_ADDRESS=${DEPLOY_HOST//./-}.sslip.io" >> "$GITHUB_ENV"
          fi
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=(secrets.DEPLOY_HOST)
          [ "$HAS_KNOWN_HOSTS" = true ] || missing+=(secrets.DEPLOY_KNOWN_HOSTS)
          [ "$HAS_DEPLOY_KEY" = true ] || missing+=(secrets.DEPLOY_SSH_KEY)
          [ "$HAS_POSTGRES_PASSWORD" = true ] || missing+=(secrets.POSTGRES_PASSWORD)
          [ "$HAS_LLM_KEYS" = true ] || missing+=(secrets.AI_DMC268_T4)
          [ "$HAS_LLM_URL" = true ] || missing+=(vars.AI_DMC268_URL)
          [ "$HAS_GH_APP_ID" = true ] || missing+=(secrets.GH_APP_ID)
          [ "$HAS_GH_APP_SLUG" = true ] || missing+=(vars.GH_APP_SLUG)
          [ "$HAS_GH_CLIENT_ID" = true ] || missing+=(secrets.GH_CLIENT_ID)
          [ "$HAS_GH_CLIENT_SECRET" = true ] || missing+=(secrets.GH_CLIENT_SECRET)
          [ "$HAS_GH_APP_PRIVATE_KEY" = true ] || missing+=(secrets.GH_APP_PRIVATE_KEY)
          [ "$HAS_GH_WEBHOOK_SECRET" = true ] || missing+=(secrets.GH_WEBHOOK_SECRET)
          [ "$HAS_SENTRY_DSN" = true ] || missing+=(secrets.SENTRY_DSN)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "**Deploy not started:** missing ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::missing ${missing[*]}"
            exit 1
          fi
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "**Deploy not started:** image tag must be a full 40-character commit sha" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$HAS_TYPESAFE_KEY" != true ]; then
            echo "::warning::secrets.TYPESAFE_API_KEY is not set: verifier disabled"
          fi
          if [ "$HAS_LLM_MODEL" != true ]; then
            echo "::warning::vars.LLM_PRIMARY_MODEL is not set: .env gets no LLM_PRIMARY_MODEL (Eurouter model not chosen)"
          fi
          # Alloy runs with all six or not at all; the app works either way
          # (docs/observability.md § Configuration and secrets).
          monitoring_missing=()
          [ "$HAS_GRAFANA_PROM_URL" = true ] || monitoring_missing+=(vars.GRAFANA_CLOUD_PROM_URL)
          [ "$HAS_GRAFANA_PROM_USER" = true ] || monitoring_missing+=(vars.GRAFANA_CLOUD_PROM_USER)
          [ "$HAS_GRAFANA_LOKI_URL" = true ] || monitoring_missing+=(vars.GRAFANA_CLOUD_LOKI_URL)
          [ "$HAS_GRAFANA_LOKI_USER" = true ] || monitoring_missing+=(vars.GRAFANA_CLOUD_LOKI_USER)
          [ "$HAS_GRAFANA_TOKEN" = true ] || monitoring_missing+=(secrets.GRAFANA_CLOUD_TOKEN)
          [ "$HAS_POSTGRES_EXPORTER_PASSWORD" = true ] || monitoring_missing+=(secrets.POSTGRES_EXPORTER_PASSWORD)
          if [ "${#monitoring_missing[@]}" -gt 0 ]; then
            echo "::warning::Alloy not started, missing ${monitoring_missing[*]}: no metrics or logs reach Grafana Cloud"
            echo "MONITORING=off" >> "$GITHUB_ENV"
          else
            echo "MONITORING=on" >> "$GITHUB_ENV"
          fi

      - name: Set up SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName %s\n  User deploy\n  Port 22\n  StrictHostKeyChecking yes\n  BatchMode yes\n  ConnectTimeout 15\n  LogLevel ERROR\n' "$DEPLOY_HOST" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          agent_sock="$RUNNER_TEMP/ssh-agent.sock"
          eval "$(ssh-agent -s -a "$agent_sock")" >/dev/null
          printf '%s\n' "$DEPLOY_SSH_KEY" | ssh-add -q -
          echo "SSH_AUTH_SOCK=$agent_sock" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if ! out=$(ssh deploy-target true 2>&1); then
            case "$out" in
              *"Permission denied"*) reason="permission denied for deploy (check DEPLOY_SSH_KEY)" ;;
              *"Host key verification failed"*) reason="host key does not match DEPLOY_KNOWN_HOSTS" ;;
              *"timed out"*) reason="timeout: SSH connection timed out" ;;
              *"Connection refused"*) reason="connection refused on port 22" ;;
              *) reason="ssh failed: $(printf '%s' "$out" | head -n 1)" ;;
            esac
            echo "**Deploy failed:** $reason" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$reason"
            exit 1
          fi

      - name: Upload compose files
        run: |
          set -euo pipefail
          scp -q deploy/compose.yml deploy/Caddyfile "deploy-target:$APP_DIR/"
          ssh deploy-target "mkdir -p $APP_DIR/alloy"
          scp -q deploy/alloy/config.alloy "deploy-target:$APP_DIR/alloy/"

      - name: Write runtime .env
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          LLM_PRIMARY_API_KEYS: ${{ secrets.AI_DMC268_T4 }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          LLM_PRIMARY_BASE_URL: ${{ vars.AI_DMC268_URL }}
          LLM_PRIMARY_MODEL: ${{ vars.LLM_PRIMARY_MODEL }}
          LLM_PRIMARY_PROVIDER_ORDER: ${{ vars.LLM_PRIMARY_PROVIDER_ORDER }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_SLUG: ${{ vars.GH_APP_SLUG }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GRAFANA_CLOUD_PROM_URL: ${{ vars.GRAFANA_CLOUD_PROM_URL }}
          GRAFANA_CLOUD_PROM_USER: ${{ vars.GRAFANA_CLOUD_PROM_USER }}
          GRAFANA_CLOUD_LOKI_URL: ${{ vars.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USER: ${{ vars.GRAFANA_CLOUD_LOKI_USER }}
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
          POSTGRES_EXPORTER_PASSWORD: ${{ secrets.POSTGRES_EXPORTER_PASSWORD }}
          SENTRY_WEBHOOK_SECRET: ${{ secrets.SENTRY_WEBHOOK_SECRET }}
          ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERTS_TELEGRAM_BOT_TOKEN }}
          ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.ALERTS_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          env_line() { printf '%s=%s\n' "$1" "$(printf '%s' "$2" | tr -d '\r\n')"; }
          # Grafana Cloud shows a stack's base URL, its query URL or its push URL;
          # Alloy needs the push one, whichever the variable holds.
          prom_push=${GRAFANA_CLOUD_PROM_URL%/}
          prom_push=${prom_push%/api/prom/push}
          prom_push="${prom_push%/api/prom}/api/prom/push"
          loki_push=${GRAFANA_CLOUD_LOKI_URL%/}
          loki_push="${loki_push%/loki/api/v1/push}/loki/api/v1/push"
          # DATABASE_URL embeds the password in the URL, so the password
          # must be percent-encoded (a raw '@', '/' or ':' in it would
          # corrupt the DSN the api and worker read from this .env).
          ENC_PASSWORD=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$POSTGRES_PASSWORD")
          {
            env_line IMAGE_TAG "$IMAGE_TAG"
            env_line ENV production
            # Rotated JSON log files on the host volume (docs/observability.md § Local fallback).
            env_line LOG_DIR /logs
            env_line POSTGRES_USER dmc
            env_line POSTGRES_DB dmc268
            env_line POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
            env_line DATABASE_URL "postgresql+asyncpg://dmc:${ENC_PASSWORD}@postgres:5432/dmc268"
            env_line LLM_PRIMARY_API_KEYS "$LLM_PRIMARY_API_KEYS"
            if [ -n "$TYPESAFE_API_KEY" ]; then env_line TYPESAFE_API_KEY "$TYPESAFE_API_KEY"; fi
            env_line LLM_PRIMARY_BASE_URL "$LLM_PRIMARY_BASE_URL"
            env_line LLM_TIMEOUT_SECONDS 300
            env_line SITE_ADDRESS                "$SITE_ADDRESS"
            env_line SERVER_IP                   "$DEPLOY_HOST"
            env_line APP_ORIGIN                  "https://$SITE_ADDRESS"
            env_line GITHUB_CALLBACK_URL         "https://$SITE_ADDRESS/api/auth/github/callback"
            env_line GITHUB_CLIENT_ID            "$GITHUB_CLIENT_ID"
            env_line GITHUB_CLIENT_SECRET        "$GITHUB_CLIENT_SECRET"
            env_line GITHUB_APP_ID               "$GITHUB_APP_ID"
            env_line GITHUB_APP_SLUG             "$GITHUB_APP_SLUG"
            env_line GITHUB_APP_PRIVATE_KEY_PATH $APP_DIR/github-app.pem
            env_line GITHUB_WEBHOOK_SECRET       "$GITHUB_WEBHOOK_SECRET"
            env_line SENTRY_DSN                  "$SENTRY_DSN"
            if [ -n "$LLM_PRIMARY_MODEL" ]; then env_line LLM_PRIMARY_MODEL "$LLM_PRIMARY_MODEL"; fi
            if [ -n "$LLM_PRIMARY_PROVIDER_ORDER" ]; then env_line LLM_PRIMARY_PROVIDER_ORDER "$LLM_PRIMARY_PROVIDER_ORDER"; fi
            # The Sentry → Telegram relay (docs/observability.md § Alerts): no secret, no
            # route (404); no bot token or chat id, alerts are logged as alert.dropped.
            if [ -n "$SENTRY_WEBHOOK_SECRET" ]; then env_line SENTRY_WEBHOOK_SECRET "$SENTRY_WEBHOOK_SECRET"; fi
            if [ -n "$ALERTS_TELEGRAM_BOT_TOKEN" ]; then env_line ALERTS_TELEGRAM_BOT_TOKEN "$ALERTS_TELEGRAM_BOT_TOKEN"; fi
            if [ -n "$ALERTS_TELEGRAM_CHAT_ID" ]; then env_line ALERTS_TELEGRAM_CHAT_ID "$ALERTS_TELEGRAM_CHAT_ID"; fi
            if [ "$MONITORING" = on ]; then
              # compose reads COMPOSE_PROFILES from this file: the alloy service starts.
              env_line COMPOSE_PROFILES           monitoring
              env_line GRAFANA_CLOUD_PROM_URL     "$prom_push"
              env_line GRAFANA_CLOUD_PROM_USER    "$GRAFANA_CLOUD_PROM_USER"
              env_line GRAFANA_CLOUD_LOKI_URL     "$loki_push"
              env_line GRAFANA_CLOUD_LOKI_USER    "$GRAFANA_CLOUD_LOKI_USER"
              env_line GRAFANA_CLOUD_TOKEN        "$GRAFANA_CLOUD_TOKEN"
              env_line POSTGRES_EXPORTER_PASSWORD "$POSTGRES_EXPORTER_PASSWORD"
            fi
          } | ssh deploy-target "umask 077 && cat > $APP_DIR/.env.new && mv $APP_DIR/.env.new $APP_DIR/.env"

      - name: Write the App private key
        env:
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Deliberately not env_line: that strips newlines, and a PEM is
          # multi-line. The container reads this path, so compose mounts the
          # file at the same path it has on the host (deploy/compose.yml).
          printf '%s\n' "$GITHUB_APP_PRIVATE_KEY" | ssh deploy-target "
            umask 077 && cat > $APP_DIR/github-app.pem.new
            grep -q 'PRIVATE KEY' $APP_DIR/github-app.pem.new || {
              echo 'secrets.GH_APP_PRIVATE_KEY is not a PEM private key' >&2
              rm -f $APP_DIR/github-app.pem.new
              exit 1
            }
            chmod 644 $APP_DIR/github-app.pem.new
            mv $APP_DIR/github-app.pem.new $APP_DIR/github-app.pem"

      - name: Pull and start
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | ssh deploy-target "set -euo pipefail
            cd $APP_DIR
            trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
            docker login ghcr.io --username '${{ github.actor }}' --password-stdin >/dev/null
            docker compose config --quiet
            docker compose pull --quiet
            docker compose up --detach --remove-orphans
            docker image prune --force >/dev/null
            docker compose ps --format 'table {{.Service}}\t{{.Status}}'"

      - name: Smoke test through Caddy
        run: |
          set -uo pipefail
          # The first certificate issuance can take up to a minute, hence 20 attempts 5 s apart.
          if body=$(ssh deploy-target "for attempt in \$(seq 1 20); do
                curl -fsS --max-time 10 --resolve '$SITE_ADDRESS:443:127.0.0.1' 'https://$SITE_ADDRESS/api/health' && exit 0
                sleep 5
              done
              exit 1"); then
            echo "health: $body"
            {
              echo "## Deploy"
              echo "- image: \`${IMAGE}:${IMAGE_TAG}\`"
              echo "- \`GET /api/health\` through Caddy: \`$body\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            logs=$(ssh deploy-target "cd $APP_DIR && docker compose logs --no-color --tail 50 api" 2>&1)
            printf '%s\n' "$logs"
            {
              echo "**Deploy failed:** /api/health did not answer over HTTPS through Caddy after 20 attempts"
              echo '```text'
              printf '%s\n' "$logs"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Smoke test from the internet
        run: |
          set -uo pipefail
          fail() {
            echo "**Deploy failed:** $1" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }
          base="https://$SITE_ADDRESS"
          body=""
          # No -k: the certificate must be valid for the site name.
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --max-time 10 "$base/api/health" 2>/dev/null) && break
            body=""
            sleep 5
          done
          [ -n "$body" ] || fail "/api/health is not reachable over HTTPS with a valid certificate"
          echo "external health: $body"
          redirect=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code} %{redirect_url}' "http://$SITE_ADDRESS/api/health")
          code=${redirect%% *}
          target=${redirect#* }
          if ! [[ "$code" =~ ^30[1278]$ && "$target" == "$base/api/health" ]]; then
            fail "http does not redirect to https (status $code)"
          fi
          echo "http redirects to https with $code"
          ip_redirect=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code} %{redirect_url}' "http://$DEPLOY_HOST/api/health")
          if ! [[ "${ip_redirect%% *}" =~ ^30[1278]$ && "${ip_redirect#* }" == "$base/api/health" ]]; then
            fail "http://<IP> does not redirect to the site name (status ${ip_redirect%% *})"
          fi
          echo "http://<IP> redirects to the site name"
          # Metrics are served on internal ports only; the public site must not have them.
          metrics_status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$base/api/metrics")
          [ "$metrics_status" = 404 ] || fail "/api/metrics answers $metrics_status, not 404"
          echo "/api/metrics is 404"
          certificate=$(echo | openssl s_client -connect "$SITE_ADDRESS:443" -servername "$SITE_ADDRESS" 2>/dev/null \
            | openssl x509 -noout -issuer -enddate | tr '\n' ' ')
          echo "certificate: $certificate"
          {
            echo "- \`GET /api/health\` over HTTPS from the runner (certificate verified): \`$body\`"
            echo "- http redirects to https: \`$code\`"
            echo "- \`/api/metrics\`: \`404\`"
            echo "- certificate: \`$certificate\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check exposed ports
        run: |
          set -euo pipefail
          # Netid State Recv-Q Send-Q Local:Port Peer:Port; loopback and link-local are not reachable from outside.
          exposed=$(ssh deploy-target "ss -Htuln" \
            | awk '{print $1, $5}' \
            | grep -v -E ' (127\.|\[::1\]|::1|\[fe80:|fe80:)' \
            | grep -v -E '%lo:' \
            | sed -E 's/^(tcp|udp) .*:([0-9]+)$/\1\/\2/' | sort -u | tr '\n' ' ')
          echo "listening outside loopback: $exposed"
          echo "- listening outside loopback: \`$exposed\`" >> "$GITHUB_STEP_SUMMARY"
          unexpected=$(printf '%s\n' $exposed | grep -v -x -E 'tcp/22|tcp/80|tcp/443' || true)
          if [ -n "$unexpected" ]; then
            echo "**Unexpected exposed ports:** $(echo $unexpected)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::unexpected exposed ports: $(echo $unexpected)"
            exit 1
          fi

      # Deploy markers (docs/observability.md § Dashboards): an annotation on every Grafana
      # dashboard, and a Sentry release with its commits and a production deploy. Each is
      # skipped with a warning when its token is missing; neither fails the deploy.
      - name: Grafana deploy annotation
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_SA_TOKEN: ${{ secrets.GRAFANA_SA_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "$GRAFANA_URL" ] || [ -z "$GRAFANA_SA_TOKEN" ]; then
            echo "::warning::no deploy annotation: vars.GRAFANA_URL or secrets.GRAFANA_SA_TOKEN is not set"
            exit 0
          fi
          body=$(printf '{"tags":["deploy"],"text":"%s"}' "$IMAGE_TAG")
          if curl -fsS --max-time 15 -o /dev/null -X POST "${GRAFANA_URL%/}/api/annotations" \
              -H "Authorization: Bearer $GRAFANA_SA_TOKEN" -H "Content-Type: application/json" \
              -d "$body"; then
            echo "- Grafana deploy annotation: \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the Grafana deploy annotation failed"
          fi

      - name: Sentry release and deploy
        env:
          # An Organization Token: it names its organisation and region itself.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: dmc268-backend
        run: |
          set -uo pipefail
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::no Sentry release: secrets.SENTRY_AUTH_TOKEN is not set"
            exit 0
          fi
          cli() { npx --yes @sentry/cli@3.8.2 "$@"; }
          # The release is IMAGE_TAG, as the SDK reports it (adapters/observability/config.py).
          if cli releases new -p "$SENTRY_PROJECT" "$IMAGE_TAG" \
              && cli releases set-commits "$IMAGE_TAG" --auto --ignore-missing \
              && cli releases finalize "$IMAGE_TAG" \
              && cli deploys new --release "$IMAGE_TAG" -e production; then
            echo "- Sentry release and production deploy: \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the Sentry release or deploy failed"
          fi

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k >/dev/null 2>&1 || true
