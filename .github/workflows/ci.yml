name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dmc
          POSTGRES_PASSWORD: dmc
          POSTGRES_DB: dmc268
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e ".[dev]"

      - name: Ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Mypy
        run: .venv/bin/mypy domain adapters

      - name: Pytest
        # The tests/db and tests/ports fixtures probe PostgreSQL themselves and
        # skip when it is down; with the service up they must never skip — CI
        # must not silently skip queue tests (.agents/rules/backend.md § Tests).
        env:
          DATABASE_URL: postgresql+asyncpg://dmc:dmc@localhost:5432/dmc268
        run: .venv/bin/pytest -q

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag dmc268-api:ci .

      - name: Check /health in the container
        run: |
          set -uo pipefail
          # The app validates every setting at import (api/config.py,
          # adapters/github/config.py), so the image cannot boot without them.
          # These values are throwaway: the step calls only GET /health, a safe
          # method, so the CSRF check never compares APP_ORIGIN and nothing
          # reaches GitHub.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/ci-app.pem"
          # On the Linux runner a bind mount keeps the host's uid and mode, so a
          # 0600 key owned by the runner user is unreadable to uid 10001 in the
          # container. Docker Desktop remaps ownership instead, so this is not
          # reproducible on macOS. The key is throwaway and the runner ephemeral.
          chmod 644 "$RUNNER_TEMP/ci-app.pem"
          docker run --detach --name api \
            --publish 127.0.0.1:8000:8000 \
            --volume "$RUNNER_TEMP/ci-app.pem:/run/app.pem:ro" \
            --env APP_ORIGIN=http://localhost:8000 \
            --env GITHUB_CLIENT_ID=ci \
            --env GITHUB_CLIENT_SECRET=ci \
            --env GITHUB_CALLBACK_URL=http://localhost:8000/auth/github/callback \
            --env GITHUB_APP_ID=1 \
            --env GITHUB_APP_PRIVATE_KEY_PATH=/run/app.pem \
            --env GITHUB_APP_SLUG=ci \
            --env GITHUB_WEBHOOK_SECRET=ci \
            dmc268-api:ci
          for attempt in $(seq 1 10); do
            if body=$(curl -fsS http://127.0.0.1:8000/health); then
              echo "attempt $attempt: $body"
              [ "$body" = '{"status":"ok"}' ] && exit 0
            fi
            sleep 2
          done
          docker logs api
          echo "::error::/health did not return {\"status\":\"ok\"}"
          exit 1

      - name: Container runs as non-root
        run: |
          user=$(docker exec api id -u)
          echo "uid in container: $user"
          [ "$user" != "0" ]

      - name: Validate production compose file
        working-directory: deploy
        run: |
          printf 'IMAGE_TAG=ci\nPOSTGRES_USER=dmc\nPOSTGRES_PASSWORD=dummy\nPOSTGRES_DB=dmc268\nSITE_ADDRESS=localhost\nSERVER_IP=127.0.0.1\n' > .env
          docker compose -f compose.yml config --quiet
          # And as deploy.yml runs it when the Grafana settings exist: with Alloy.
          export COMPOSE_PROFILES=monitoring
          docker compose -f compose.yml config --quiet
          echo "compose.yml is valid; published ports:"
          docker compose -f compose.yml config --format json | python3 -c "import json,sys; c=json.load(sys.stdin); print({n: [p.get('published') for p in s.get('ports', [])] for n, s in c['services'].items()})"
          # Only Caddy publishes ports (devops decision 10); metrics stay on the compose network.
          docker compose -f compose.yml config --format json | python3 -c "import json,sys; c=json.load(sys.stdin); bad=[n for n, s in c['services'].items() if s.get('ports') and n != 'caddy']; sys.exit(f'publishes ports: {bad}' if bad else 0)"

      - name: Validate Caddy and Alloy configs
        working-directory: deploy
        run: |
          # The images compose runs, so the check matches production.
          images=$(COMPOSE_PROFILES=monitoring docker compose -f compose.yml config --format json | python3 -c "import json,sys; s=json.load(sys.stdin)['services']; print(s['caddy']['image'], s['alloy']['image'])")
          read -r caddy_image alloy_image <<<"$images"
          docker run --rm -e SITE_ADDRESS=localhost -e SERVER_IP=127.0.0.1 \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$caddy_image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -v "$PWD/alloy/config.alloy:/etc/alloy/config.alloy:ro" "$alloy_image" \
            validate /etc/alloy/config.alloy

      - name: Validate local compose file
        run: |
          docker compose -f docker-compose.yml config --quiet
          # The observability lab (deploy/lab/README.md).
          docker compose -f deploy/lab/compose.yml config --quiet
          echo "docker-compose.yml is valid; published ports:"
          docker compose -f docker-compose.yml config --format json | python3 -c "import json,sys; c=json.load(sys.stdin); print({n: [p.get('published') for p in s.get('ports', [])] for n, s in c['services'].items()})"

  alert-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Every rule fires, stays quiet, ignores an absent series and yields to its root
      # (docs/observability.md § Alerts, "Rules are tested in CI").
      - name: promtool check and test
        working-directory: ops/observability/alerts
        run: |
          # The lab's Prometheus, so the rules are tested by the version the lab runs.
          image=$(grep -oE 'prom/prometheus:v[0-9.]+' ../../../deploy/lab/compose.yml)
          echo "promtool from $image"
          docker run --rm -v "$PWD:/alerts:ro" -w /alerts --entrypoint promtool "$image" \
            check rules *.rules.yaml
          # rule_files in a test file are relative to the test file.
          docker run --rm -v "$PWD:/alerts:ro" -w /alerts --entrypoint promtool "$image" \
            test rules tests/*.test.yaml
          # The "No throughput" drill copy, pushed only for the drill.
          docker run --rm -v "$PWD:/alerts:ro" -w /alerts --entrypoint promtool "$image" \
            check rules drill/*.rules.yaml
          docker run --rm -v "$PWD:/alerts:ro" -w /alerts --entrypoint promtool "$image" \
            test rules drill/tests/*.test.yaml
