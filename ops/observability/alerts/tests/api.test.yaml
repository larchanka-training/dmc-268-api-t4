# promtool test rules (docs/observability.md § Alerts): for each rule, a case that fires,
# one that does not, the absent series, and the suppression by its root.
rule_files:
  - ../api.rules.yaml
evaluation_interval: 1m

tests:
  - name: TargetDown fires after 2 minutes without a scrape
    interval: 1m
    input_series:
      - series: 'up{job="api", instance="api:9100"}'
        values: '1 1 0 0 0 0'
    alert_rule_test:
      - {eval_time: 1m, alertname: TargetDown, exp_alerts: []}
      - {eval_time: 3m, alertname: TargetDown, exp_alerts: []}
      - eval_time: 4m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {job: api, instance: "api:9100", domain: api, severity: critical, owner: unassigned}
            exp_annotations: &target_down
              summary: The API answers no scrape.
              runbook_url: https://github.com/larchanka-training/dmc-268-api-t4/blob/main/docs/runbooks.md#target-down

  - name: No series, no alert
    interval: 1m
    input_series: []
    alert_rule_test:
      - {eval_time: 15m, alertname: TargetDown, exp_alerts: []}
      - {eval_time: 15m, alertname: ApiErrorRate, exp_alerts: []}
      - {eval_time: 15m, alertname: ApiLatency, exp_alerts: []}
      - {eval_time: 20m, alertname: SecurityEvents, exp_alerts: []}

  - name: ApiErrorRate fires at 10% 5xx
    interval: 1m
    input_series:
      - {series: 'up{job="api", instance="api:9100"}', values: '1x15'}
      - {series: 'http_requests_total{route="/repositories", method="GET", status_class="2xx"}', values: '0+90x15'}
      - {series: 'http_requests_total{route="/repositories", method="GET", status_class="5xx"}', values: '0+10x15'}
    alert_rule_test:
      - eval_time: 12m
        alertname: ApiErrorRate
        exp_alerts:
          - exp_labels: {domain: api, severity: critical, owner: unassigned}
            exp_annotations: &api_error_rate
              summary: Over 5% of API requests answered 5xx in 10 minutes.
              runbook_url: https://github.com/larchanka-training/dmc-268-api-t4/blob/main/docs/runbooks.md#api-error-rate

  - name: ApiErrorRate stays quiet at 1% 5xx
    interval: 1m
    input_series:
      - {series: 'up{job="api", instance="api:9100"}', values: '1x15'}
      - {series: 'http_requests_total{route="/repositories", method="GET", status_class="2xx"}', values: '0+99x15'}
      - {series: 'http_requests_total{route="/repositories", method="GET", status_class="5xx"}', values: '0+1x15'}
    alert_rule_test:
      - {eval_time: 12m, alertname: ApiErrorRate, exp_alerts: []}

  - name: ApiErrorRate needs 20 requests
    interval: 1m
    input_series:
      - {series: 'up{job="api", instance="api:9100"}', values: '1x15'}
      - {series: 'http_requests_total{route="/repositories", method="GET", status_class="5xx"}', values: '0+1x15'}
    alert_rule_test:
      - {eval_time: 12m, alertname: ApiErrorRate, exp_alerts: []}

  - name: ApiErrorRate leaves /health out
    interval: 1m
    input_series:
      - {series: 'up{job="api", instance="api:9100"}', values: '1x15'}
      - {series: 'http_requests_total{route="/health", method="GET", status_class="2xx"}', values: '0+1000x15'}
      - {series: 'http_requests_total{route="/repositories", method="GET", status_class="2xx"}', values: '0+27x15'}
      - {series: 'http_requests_total{route="/repositories", method="GET", status_class="5xx"}', values: '0+3x15'}
    alert_rule_test:
      - eval_time: 12m
        alertname: ApiErrorRate
        exp_alerts:
          - exp_labels: {domain: api, severity: critical, owner: unassigned}
            exp_annotations: *api_error_rate

  - name: ApiErrorRate and ApiLatency are suppressed while the API is down
    interval: 1m
    input_series:
      - {series: 'up{job="api", instance="api:9100"}', values: '1x5 0x10'}
      - {series: 'http_requests_total{route="/repositories", method="GET", status_class="2xx"}', values: '0+90x15'}
      - {series: 'http_requests_total{route="/repositories", method="GET", status_class="5xx"}', values: '0+10x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/repositories", method="GET", le="1"}', values: '0x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/repositories", method="GET", le="5"}', values: '0+10x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/repositories", method="GET", le="+Inf"}', values: '0+10x15'}
    alert_rule_test:
      - {eval_time: 12m, alertname: ApiErrorRate, exp_alerts: []}
      - {eval_time: 12m, alertname: ApiLatency, exp_alerts: []}

  - name: ApiLatency fires when p95 is over 2 s, and not when requests are fast
    interval: 1m
    input_series:
      - {series: 'up{job="api", instance="api:9100"}', values: '1x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/repositories", method="GET", le="1"}', values: '0x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/repositories", method="GET", le="2.5"}', values: '0x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/repositories", method="GET", le="5"}', values: '0+10x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/repositories", method="GET", le="+Inf"}', values: '0+10x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/health", method="GET", le="1"}', values: '0+100x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/health", method="GET", le="2.5"}', values: '0+100x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/health", method="GET", le="5"}', values: '0+100x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/health", method="GET", le="+Inf"}', values: '0+100x15'}
    alert_rule_test:
      - eval_time: 12m
        alertname: ApiLatency
        exp_alerts:
          - exp_labels: {domain: api, severity: warning, owner: unassigned}
            exp_annotations:
              summary: API p95 latency over 2 s for 10 minutes.
              runbook_url: https://github.com/larchanka-training/dmc-268-api-t4/blob/main/docs/runbooks.md#api-latency

  - name: ApiLatency stays quiet when requests are fast
    interval: 1m
    input_series:
      - {series: 'up{job="api", instance="api:9100"}', values: '1x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/repositories", method="GET", le="1"}', values: '0+10x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/repositories", method="GET", le="5"}', values: '0+10x15'}
      - {series: 'http_request_duration_seconds_bucket{route="/repositories", method="GET", le="+Inf"}', values: '0+10x15'}
    alert_rule_test:
      - {eval_time: 12m, alertname: ApiLatency, exp_alerts: []}

  - name: SecurityEvents fires per kind over 20 in 15 minutes, session_rejected left out
    interval: 1m
    input_series:
      - {series: 'security_events_total{kind="csrf_rejected"}', values: '0+3x20'}
      - {series: 'security_events_total{kind="id_not_found"}', values: '0+1x20'}
      - {series: 'security_events_total{kind="session_rejected"}', values: '0+50x20'}
    alert_rule_test:
      - eval_time: 16m
        alertname: SecurityEvents
        exp_alerts:
          - exp_labels: {kind: csrf_rejected, domain: api, severity: warning, owner: unassigned}
            exp_annotations:
              summary: Over 20 security refusals of one kind in 15 minutes.
              runbook_url: https://github.com/larchanka-training/dmc-268-api-t4/blob/main/docs/runbooks.md#security-events
